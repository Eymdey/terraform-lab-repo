# Playbook WordPress
---
- name: Déploiement WordPress
  hosts: front
  become: true

  vars_files:
    - vars/secrets.yml

  vars:
    db_name: "{{ wordpress_db_name }}"
    db_user: "{{ wordpress_db_user }}"
    db_pass: "{{ wordpress_db_password }}"

  tasks:
    - name: Installation LAMP
      apt:
        name:
          - apache2
          - mariadb-server
          - php
          - php-mysql
          - libapache2-mod-php
          - python3-pymysql
        state: present

    - name: Démarrage Apache
      service:
        name: apache2
        state: started
        enabled: yes

    - name: Démarrage MariaDB
      service:
        name: mariadb
        state: started
        enabled: yes

    - name: Création base WordPress
      mysql_db:
        name: "{{ db_name }}"
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock

    - name: Création user WordPress
      mysql_user:
        name: "{{ db_user }}"
        password: "{{ db_pass }}"
        priv: "{{ db_name }}.*:ALL"
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock

    - name: Téléchargement WordPress
      get_url:
        url: https://wordpress.org/latest.tar.gz
        dest: /tmp/wordpress.tar.gz

    - name: Extraction WordPress
      unarchive:
        src: /tmp/wordpress.tar.gz
        dest: /var/www/html
        remote_src: yes

    - name: Permissions WordPress
      file:
        path: /var/www/html/wordpress
        owner: www-data
        group: www-data
        recurse: yes
